<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meu Turno">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Meu Turno — Driver</title>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS — PADRÃO UBER DRIVER (BASE UI DARK OLED)
       ========================================================================== */
    :root {
      --uber-black: #000000;
      --uber-surface: #141414;
      --uber-surface-elevated: #1F1F1F;
      --uber-border: #292929;
      --uber-white: #FFFFFF;
      --uber-muted: #A6A6A6;
      --uber-green: #06C167;
      --uber-green-soft: rgba(6, 193, 103, 0.14);
      --uber-blue: #276EF1;
      --uber-blue-soft: rgba(39, 110, 241, 0.16);
      --uber-yellow: #FFC043;
      --uber-red: #E11900;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    body {
      background: var(--uber-black);
      color: var(--uber-white);
      margin: 0;
      padding: 0 0 88px 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      padding: 12px 16px 24px;
    }

    /* ==========================================================================
       2. TOP BAR & PÍLULA DE GANHOS (ESTILO MAPA UBER DRIVER)
       ========================================================================== */
    .uber-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 14px;
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 50;
    }

    .status-dot-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--uber-muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #545454;
    }
    .status-dot.online {
      background: var(--uber-green);
      box-shadow: 0 0 10px var(--uber-green);
    }

    /* Pílula Central de Ganhos igual ao topo do Uber Driver */
    .earnings-pill {
      background: var(--uber-surface);
      border: 1px solid var(--uber-border);
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }
    .earnings-pill span {
      font-size: 0.78rem;
      color: var(--uber-muted);
      font-weight: 700;
    }
    .earnings-pill strong {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--uber-green);
    }

    .btn-install-top {
      display: none;
      background: var(--uber-white);
      color: var(--uber-black);
      border: none;
      border-radius: var(--radius-pill);
      padding: 7px 12px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* ==========================================================================
       3. SISTEMA DE ABAS (ANTI-BAGUNÇA: 1 TELA POR VEZ)
       ========================================================================== */
    .tab-view {
      display: none;
      animation: fadeIn 0.16s ease-out;
    }
    .tab-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       4. CARDS & COMPONENTES UBER BASE UI
       ========================================================================== */
    .uber-card {
      background: var(--uber-surface);
      border: 1px solid var(--uber-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--uber-muted);
      margin: 0;
    }

    /* Seletor de Período */
    .uber-segmented {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--uber-surface-elevated);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }
    .seg-btn {
      background: transparent;
      color: var(--uber-muted);
      border: none;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--uber-black);
      color: var(--uber-white);
    }

    /* Hero de Lucro Líquido */
    .hero-earnings {
      text-align: left;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--uber-border);
      margin-bottom: 16px;
    }
    .hero-label {
      font-size: 0.82rem;
      color: var(--uber-muted);
      font-weight: 600;
    }
    .hero-amount {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -1px;
      margin: 4px 0 6px;
      color: var(--uber-white);
    }
    .hero-breakdown {
      display: flex;
      gap: 14px;
      font-size: 0.82rem;
      color: var(--uber-muted);
    }
    .hero-breakdown b {
      color: var(--uber-white);
    }

    /* Grid de 3 KPIs limpos */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .kpi-tile {
      background: var(--uber-surface-elevated);
      border-radius: var(--radius-md);
      padding: 12px 10px;
    }
    .kpi-tile span {
      display: block;
      font-size: 0.7rem;
      color: var(--uber-muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .kpi-tile strong {
      font-size: 1rem;
      font-weight: 800;
      color: var(--uber-white);
    }

    /* Barra de Meta Diária */
    .goal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.84rem;
    }
    .goal-track {
      height: 8px;
      background: var(--uber-surface-elevated);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .goal-fill {
      height: 100%;
      width: 0%;
      background: var(--uber-green);
      transition: width 0.3s ease;
    }

    /* ==========================================================================
       5. MODO TURNO AO VIVO (DIA A DIA NA PISTA)
       ========================================================================== */
    .live-shift-card {
      border: 1px solid var(--uber-border);
      position: relative;
      overflow: hidden;
    }
    .live-shift-card.active-shift {
      border-color: var(--uber-green);
      background: linear-gradient(180deg, rgba(6, 193, 103, 0.08) 0%, var(--uber-surface) 100%);
    }

    .btn-uber-go {
      width: 100%;
      min-height: 54px;
      border-radius: var(--radius-pill);
      border: none;
      background: var(--uber-blue);
      color: var(--uber-white);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(39, 110, 241, 0.35);
    }
    .btn-uber-go:active {
      transform: scale(0.99);
    }

    .btn-uber-primary {
      width: 100%;
      min-height: 52px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--uber-white);
      color: var(--uber-black);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-uber-green {
      width: 100%;
      min-height: 52px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--uber-green);
      color: var(--uber-black);
      font-size: 1.02rem;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-uber-ghost {
      background: var(--uber-surface-elevated);
      color: var(--uber-white);
      border: 1px solid var(--uber-border);
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .chip-btn {
      background: var(--uber-surface-elevated);
      color: var(--uber-white);
      border: 1px solid var(--uber-border);
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Botões de Gasto Rápido na Rua */
    .quick-expense-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .quick-exp-btn {
      background: var(--uber-surface-elevated);
      border: 1px solid var(--uber-border);
      color: var(--uber-white);
      border-radius: var(--radius-md);
      padding: 10px 6px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .quick-exp-btn span {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 3px;
    }

    /* ==========================================================================
       6. FORMULÁRIOS E INPUTS (ALTO CONTRASTE VEICULAR)
       ========================================================================== */
    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--uber-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--uber-border);
      background: var(--uber-surface-elevated);
      color: var(--uber-white);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: var(--uber-white);
      outline: none;
      background: #262626;
    }
    input::placeholder {
      color: #595959;
      font-weight: 500;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .collapsible-panel {
      display: none;
      background: var(--uber-black);
      border: 1px solid var(--uber-border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 12px;
    }
    .collapsible-panel.open {
      display: block;
    }

    /* ==========================================================================
       7. RECIBO DE FECHAMENTO & LISTA DE ATIVIDADES
       ========================================================================== */
    .receipt-box {
      display: none;
      margin-top: 16px;
      background: var(--uber-surface);
      border: 1px solid var(--uber-green);
      border-radius: var(--radius-lg);
      padding: 18px;
    }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--uber-border);
      font-size: 0.88rem;
    }
    .receipt-row span:first-child { color: var(--uber-muted); }
    .receipt-row span:last-child { font-weight: 700; }
    .receipt-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      margin-top: 6px;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 800;
    }
    .status-good { background: var(--uber-green-soft); color: var(--uber-green); }
    .status-warn { background: rgba(255, 192, 67, 0.16); color: var(--uber-yellow); }
    .status-bad  { background: rgba(225, 25, 0, 0.18); color: var(--uber-red); }

    .activity-item {
      background: var(--uber-surface);
      border: 1px solid var(--uber-border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 10px;
    }
    .act-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .act-title {
      font-weight: 800;
      font-size: 0.95rem;
    }
    .act-net {
      font-weight: 900;
      font-size: 1rem;
      color: var(--uber-green);
    }
    .act-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 0.78rem;
      color: var(--uber-muted);
    }

    /* ==========================================================================
       8. BARRA DE NAVEGAÇÃO INFERIOR (ESTILO APP UBER DRIVER)
       ========================================================================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(14, 14, 14, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--uber-border);
      display: flex;
      justify-content: center;
      z-index: 100;
    }
    .bottom-nav-inner {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px 8px 10px;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--uber-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .nav-item.active {
      color: var(--uber-white);
    }

    /* Toast */
    .uber-toast {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--uber-white);
      color: var(--uber-black);
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-weight: 800;
      font-size: 0.84rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 200;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- TOP BAR COM PÍLULA DE GANHOS ESTILO UBER DRIVER -->
  <header class="uber-topbar">
    <div class="status-dot-wrap">
      <span id="topStatusDot" class="status-dot"></span>
      <span id="topStatusText">Offline</span>
    </div>

    <div class="earnings-pill" onclick="UIController.navegarAba('painel')" title="Lucro Líquido de Hoje">
      <span>Hoje</span>
      <strong id="pillLucroHoje">R$ 0,00</strong>
    </div>

    <button id="btnInstall" class="btn-install-top" onclick="UIController.instalarPWA()">Instalar</button>
  </header>

  <!-- ========================================================================
       ABA 1: PAINEL (GANHOS + TURNO AO VIVO NA PISTA + META)
       ======================================================================== -->
  <section id="tab-painel" class="tab-view active">
    <!-- Card de Turno ao Vivo (Início do Dia / Gastos Rápidos na Rua) -->
    <div id="cardTurnoVivo" class="uber-card live-shift-card">
      <!-- Conteúdo renderizado dinamicamente pelo UIController.renderizarTurnoVivo() -->
    </div>

    <!-- Card Principal de Ganhos (Estilo Uber Earnings) -->
    <div class="uber-card">
      <div class="uber-segmented">
        <button class="seg-btn active" onclick="UIController.mudarPeriodo('hoje', this)">Hoje</button>
        <button class="seg-btn" onclick="UIController.mudarPeriodo('7dias', this)">Semana</button>
        <button class="seg-btn" onclick="UIController.mudarPeriodo('mes', this)">Mês</button>
        <button class="seg-btn" onclick="UIController.mudarPeriodo('tudo', this)">Total</button>
      </div>

      <div class="hero-earnings">
        <div class="hero-label" id="lblPeriodoTitulo">LUCRO LÍQUIDO LIVRE (HOJE)</div>
        <div class="hero-amount" id="kpiLucroLiquido">R$ 0,00</div>
        <div class="hero-breakdown">
          <span>Bruto: <b id="kpiBruto">R$ 0,00</b></span>
          <span>•</span>
          <span>Custos: <b id="kpiCustos">R$ 0,00</b></span>
          <span>•</span>
          <span id="kpiTurnosCount">0 turnos</span>
        </div>
      </div>

      <div class="kpi-row">
        <div class="kpi-tile">
          <span>R$/KM Líq.</span>
          <strong id="kpiMediaKm">R$ 0,00</strong>
        </div>
        <div class="kpi-tile">
          <span>R$/Hora Líq.</span>
          <strong id="kpiMediaHora">R$ 0,00</strong>
        </div>
        <div class="kpi-tile">
          <span>KM Rodado</span>
          <strong id="kpiKmRodado">0 km</strong>
        </div>
      </div>
    </div>

    <!-- Card de Meta Diária -->
    <div class="uber-card">
      <div class="goal-row">
        <span id="txtMetaInfo">🎯 Meta Líquida Hoje: <strong>R$ 200,00</strong></span>
        <button class="chip-btn" onclick="UIController.editarMetaDiaria()">Editar meta</button>
      </div>
      <div class="goal-track">
        <div id="barraMetaFill" class="goal-fill"></div>
      </div>
    </div>
  </section>

  <!-- ========================================================================
       ABA 2: FECHAR TURNO (CALCULADORA LIMPA E ORGANIZADA)
       ======================================================================== -->
  <section id="tab-fechar" class="tab-view">
    <!-- Bloco 1: Odômetro e Tempo -->
    <div class="uber-card">
      <div class="card-header-row">
        <h2 class="card-title">1. Odômetro e Tempo de Pista</h2>
        <button type="button" class="chip-btn" onclick="UIController.puxarUltimoKmFinal()">🔄 Último KM</button>
      </div>

      <div class="grid-2">
        <div>
          <label>Data</label>
          <input type="date" id="dataTurno">
        </div>
        <div>
          <label>Horas Trabalhadas</label>
          <input type="number" id="horasTrabalhadas" step="0.5" inputmode="decimal" placeholder="Ex: 8.5">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>KM Inicial</label>
          <input type="number" id="kmInicial" inputmode="numeric" placeholder="Ex: 45200" oninput="UIController.aoMudarOdometro()">
        </div>
        <div>
          <label>KM Final</label>
          <input type="number" id="kmFinal" inputmode="numeric" placeholder="Ex: 45380" oninput="UIController.aoMudarOdometro()">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>KM Total Rodado</label>
          <input type="number" id="kmTotalInput" inputmode="numeric" placeholder="Ou digite direto" oninput="UIController.calcularCombustivelPorConsumo()">
        </div>
        <div>
          <label>Corridas / Entregas</label>
          <input type="number" id="corridas" inputmode="numeric" placeholder="Ex: 18">
        </div>
      </div>
    </div>

    <!-- Bloco 2: Faturamento -->
    <div class="uber-card">
      <div class="card-header-row">
        <h2 class="card-title">2. Faturamento Bruto</h2>
        <button type="button" class="chip-btn" onclick="UIController.togglePainel('painelApps')">➕ Somar por App</button>
      </div>

      <!-- Painel Expansível para somar Uber + 99 + Outros sem poluir a tela -->
      <div id="painelApps" class="collapsible-panel">
        <div class="grid-3">
          <div>
            <label>Uber (R$)</label>
            <input type="number" id="ganhoUber" step="0.01" inputmode="decimal" placeholder="0.00" oninput="UIController.somarApps()">
          </div>
          <div>
            <label>99 (R$)</label>
            <input type="number" id="ganho99" step="0.01" inputmode="decimal" placeholder="0.00" oninput="UIController.somarApps()">
          </div>
          <div>
            <label>Pix/Outros</label>
            <input type="number" id="ganhoOutros" step="0.01" inputmode="decimal" placeholder="0.00" oninput="UIController.somarApps()">
          </div>
        </div>
      </div>

      <div>
        <label>Total Bruto Recebido no Dia (R$)</label>
        <input type="number" id="faturamento" step="0.01" inputmode="decimal" placeholder="Ex: 350.00">
      </div>
    </div>

    <!-- Bloco 3: Custos e Desgaste -->
    <div class="uber-card">
      <div class="card-header-row">
        <h2 class="card-title">3. Gastos e Manutenção</h2>
        <button type="button" class="chip-btn" onclick="UIController.togglePainel('painelCalcComb')">⛽ Calc. KM/L</button>
      </div>

      <!-- Calculadora opcional por consumo KM/L -->
      <div id="painelCalcComb" class="collapsible-panel">
        <div class="grid-2">
          <div>
            <label>Consumo (KM/L)</label>
            <input type="number" id="consumoKmL" step="0.1" inputmode="decimal" placeholder="Ex: 10.5" oninput="UIController.calcularCombustivelPorConsumo()">
          </div>
          <div>
            <label>Preço do Litro (R$)</label>
            <input type="number" id="precoLitro" step="0.01" inputmode="decimal" placeholder="Ex: 5.89" oninput="UIController.calcularCombustivelPorConsumo()">
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Combustível / GNV (R$)</label>
          <input type="number" id="combustivel" step="0.01" inputmode="decimal" placeholder="0.00">
        </div>
        <div>
          <label>Alimentação / Água (R$)</label>
          <input type="number" id="alimentacao" step="0.01" inputmode="decimal" placeholder="0.00">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Diária / Aluguel Carro (R$)</label>
          <input type="number" id="diariaCarro" step="0.01" inputmode="decimal" placeholder="0.00">
        </div>
        <div>

<div id="toast" class="uber-toast"></div>

<script>
  /* ==========================================================================
     MÓDULO 1: CONSTANTES E STORAGE SERVICE (CLEAN CODE)
     ========================================================================== */
  const KEYS = {
    TURNOS: 'turnos_app',
    TURNO_ATIVO: 'meu_turno_ativo',
    META_DIARIA: 'meu_turno_meta_diaria',
    CUSTO_KM: 'meu_turno_custo_km',
    CONSUMO_KML: 'meu_turno_consumo_kml',
    PRECO_LITRO: 'meu_turno_preco_litro'
  };

  const DEFAULTS = {
    CUSTO_KM: 0.15,
    META_DIARIA: 200.00
  };

  const StorageService = {
    obterTurnos() {
      try {
        return JSON.parse(localStorage.getItem(KEYS.TURNOS) || '[]');
      } catch {
        return [];
      }
    },
    salvarTurnos(lista) {
      localStorage.setItem(KEYS.TURNOS, JSON.stringify(lista));
    },
    obterTurnoAtivo() {
      try {
        return JSON.parse(localStorage.getItem(KEYS.TURNO_ATIVO) || 'null');
      } catch {
        return null;
      }
    },
    salvarTurnoAtivo(dados) {
      if (!dados) {
        localStorage.removeItem(KEYS.TURNO_ATIVO);
      } else {
        localStorage.setItem(KEYS.TURNO_ATIVO, JSON.stringify(dados));
      }
    },
    obterNumero(chave, padrao) {
      const val = parseFloat(localStorage.getItem(chave));
      return isNaN(val) ? padrao : val;
    },
    salvarValor(chave, valor) {
      localStorage.setItem(chave, String(valor));
    }
  };

  /* ==========================================================================
     MÓDULO 2: FINANCE ENGINE (REGRAS DE NEGÓCIO E FÓRMULAS PURAS)
     ========================================================================== */
  const FinanceEngine = {
    calcularTurno(entrada) {
      const kmTotal = entrada.kmFim > entrada.kmIni
        ? (entrada.kmFim - entrada.kmIni)
        : Math.max(0, entrada.kmDireto);

      const provisaoManut = kmTotal * entrada.custoKm;
      const gastosDiretos = entrada.combustivel + entrada.alimentacao + entrada.diariaCarro + entrada.outrosGastos;
      const custosTotais = gastosDiretos + provisaoManut;
      const lucroLiquido = entrada.faturamento - custosTotais;

      const brutoKm = kmTotal > 0 ? (entrada.faturamento / kmTotal).toFixed(2) : '0.00';
      const liquidoKm = kmTotal > 0 ? (lucroLiquido / kmTotal).toFixed(2) : '0.00';
      const ticketMedio = entrada.corridas > 0 ? (entrada.faturamento / entrada.corridas).toFixed(2) : '0.00';
      const brutoHora = entrada.horas > 0 ? (entrada.faturamento / entrada.horas).toFixed(2) : '0.00';
      const liquidoHora = entrada.horas > 0 ? (lucroLiquido / entrada.horas).toFixed(2) : '0.00';
      const margemLiquida = entrada.faturamento > 0
        ? Math.round((lucroLiquido / entrada.faturamento) * 100)
        : 0;

      return {
        kmTotal: Number(kmTotal.toFixed(1)),
        provisaoManut: Number(provisaoManut.toFixed(2)),
        gastosDiretos: Number(gastosDiretos.toFixed(2)),
        custosTotais: Number(custosTotais.toFixed(2)),
        lucroLiquido: lucroLiquido.toFixed(2),
        brutoKm,
        liquidoKm,
        ticketMedio,
        brutoHora,
        liquidoHora,
        margemLiquida
      };
    },

    avaliarRentabilidade(calc) {
      const liq = parseFloat(calc.lucroLiquido);
      const liqKm = parseFloat(calc.liquidoKm);
      if (liq <= 0 || (calc.kmTotal > 0 && liqKm < 0.85)) {
        return { classe: 'status-bad', rotulo: '⚠️ Margem Baixa' };
      }
      if (calc.kmTotal > 0 && liqKm < 1.35) {
        return { classe: 'status-warn', rotulo: '👍 Turno Regular' };
      }
      return { classe: 'status-good', rotulo: '🔥 Alta Rentabilidade' };
    }
  };

  /* ==========================================================================
     MÓDULO 3: UI CONTROLLER (INTERAÇÃO, NAVEGAÇÃO E RENDERIZAÇÃO)
     ========================================================================== */
  const UIController = {
    periodoAtual: 'hoje',
    ultimoTextoWhatsApp: '',
    deferredPrompt: null,

    iniciar() {
      const hojeISO = new Date().toISOString().split('T')[0];
      document.getElementById('dataTurno').value = hojeISO;
      document.getElementById('custoKm').value = StorageService.obterNumero(KEYS.CUSTO_KM, DEFAULTS.CUSTO_KM);

      const kml = StorageService.obterNumero(KEYS.CONSUMO_KML, 0);
      const preco = StorageService.obterNumero(KEYS.PRECO_LITRO, 0);
      if (kml > 0) document.getElementById('consumoKmL').value = kml;
      if (preco > 0) document.getElementById('precoLitro').value = preco;

      this.renderizarTurnoVivo();
      this.atualizarPainel();
      this.renderizarHistorico();
    },

    lerNumero(id) {
      const el = document.getElementById(id);
      if (!el || !el.value) return 0;
      const num = parseFloat(String(el.value).replace(',', '.'));
      return isNaN(num) || num < 0 ? 0 : num;
    },

    notificar(mensagem) {
      const toast = document.getElementById('toast');
      toast.textContent = mensagem;
      toast.style.display = 'block';
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2600);
    },

    navegarAba(aba) {
      document.querySelectorAll('.tab-view').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

      document.getElementById(`tab-${aba}`).classList.add('active');
      document.getElementById(`nav-${aba}`).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    togglePainel(id) {
      document.getElementById(id).classList.toggle('open');
    },

    /* --- Fluxo do Dia a Dia na Pista (Turno ao Vivo + Gastos Rápidos) --- */
    renderizarTurnoVivo() {
      const ativo = StorageService.obterTurnoAtivo();
      const card = document.getElementById('cardTurnoVivo');
      const dot = document.getElementById('topStatusDot');
      const txt = document.getElementById('topStatusText');

      if (!ativo) {
        card.classList.remove('active-shift');
        dot.classList.remove('online');
        txt.textContent = 'Fora de turno';

        card.innerHTML = `
          <div class="card-header-row" style="margin-bottom:10px;">
            <h2 class="card-title">Pronto para rodar?</h2>
            <span style="font-size:0.75rem; color:var(--uber-muted);">Salva hora e KM inicial</span>
          </div>
          <button class="btn-uber-go" onclick="UIController.iniciarTurnoNaPista()">
            <span>▶ INICIAR TURNO AGORA</span>
          </button>
        `;
        return;
      }

      card.classList.add('active-shift');
      dot.classList.add('online');
      txt.textContent = 'Em Turno';

      const duracaoHoras = Math.max(0.1, (Date.now() - ativo.inicioMs) / 3600000);
      const horasInt = Math.floor(duracaoHoras);
      const minInt = Math.round((duracaoHoras - horasInt) * 60);
      const totalGastosParciais = (ativo.combustivel || 0) + (ativo.alimentacao || 0) + (ativo.outrosGastos || 0);

      card.innerHTML = `
        <div class="card-header-row" style="margin-bottom:8px;">
          <span class="status-badge status-good">🟢 EM TURNO DESDE ${ativo.horaFormatada}</span>
          <span style="font-size:0.8rem; font-weight:700;">${horasInt}h ${minInt}m</span>
        </div>
        <div style="font-size:0.85rem; color:var(--uber-muted); margin-bottom:10px;">
          Odômetro Inicial: <b style="color:#fff;">${ativo.kmInicial || 'Não informado'} km</b> •
          Gastos anotados hoje: <b style="color:#fff;">R$ ${totalGastosParciais.toFixed(2)}</b>
        </div>

        <div style="font-size:0.72rem; color:var(--uber-muted); text-transform:uppercase; font-weight:700;">
          Anote gastos rápidos na rua:
        </div>
        <div class="quick-expense-grid">
          <button class="quick-exp-btn" onclick="UIController.lancarGastoRapido('combustivel', 'Combustível / GNV')">
            <span>⛽</span>+ Combustível<br><small style="color:var(--uber-muted)">R$ ${(ativo.combustivel || 0).toFixed(0)}</small>
          </button>
          <button class="quick-exp-btn" onclick="UIController.lancarGastoRapido('alimentacao', 'Alimentação / Água')">
            <span>🍔</span>+ Refeição<br><small style="color:var(--uber-muted)">R$ ${(ativo.alimentacao || 0).toFixed(0)}</small>
          </button>
          <button class="quick-exp-btn" onclick="UIController.lancarGastoRapido('outrosGastos', 'Pedágio / Lavagem / Outros')">
            <span>🧼</span>+ Outros<br><small style="color:var(--uber-muted)">R$ ${(ativo.outrosGastos || 0).toFixed(0)}</small>
          </button>
        </div>

        <div class="grid-2" style="margin-top:10px;">
          <button class="btn-uber-primary" onclick="UIController.prepararEncerramentoTurno()">
            🏁 Encerrar Turno
          </button>
          <button class="btn-uber-ghost" onclick="UIController.cancelarTurnoVivo()">
            Cancelar
          </button>
        </div>
      `;
    },

    iniciarTurnoNaPista() {
      const turnos = StorageService.obterTurnos();
      const ultimoComKm = turnos.find(t => t.kmFinal && t.kmFinal > 0);
      const sugestaoKm = ultimoComKm ? String(ultimoComKm.kmFinal) : '';

      const kmStr = prompt('Qual o KM Inicial no painel do veículo agora?\n(Deixe em branco se preferir digitar só no final)', sugestaoKm);
      if (kmStr === null) return;

      const kmInicial = parseFloat(kmStr.replace(',', '.')) || 0;
      const agora = new Date();
      const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      StorageService.salvarTurnoAtivo({
        inicioMs: Date.now(),
        horaFormatada,
        kmInicial,
        combustivel: 0,
        alimentacao: 0,
        outrosGastos: 0
      });

      this.renderizarTurnoVivo();
      this.notificar('Bom trabalho! Turno iniciado.');
    },

    lancarGastoRapido(campo, nomeAmigavel) {
      const ativo = StorageService.obterTurnoAtivo();
      if (!ativo) return;

      const valorStr = prompt(`Quanto você gastou agora com ${nomeAmigavel} (R$)?`);
      if (!valorStr) return;

      const valor = parseFloat(valorStr.replace(',', '.'));
      if (isNaN(valor) || valor <= 0) return;

      ativo[campo] = Number(((ativo[campo] || 0) + valor).toFixed(2));
      StorageService.salvarTurnoAtivo(ativo);
      this.renderizarTurnoVivo();
      this.notificar(`+ R$ ${valor.toFixed(2)} somado em ${nomeAmigavel}!`);
    },

    prepararEncerramentoTurno() {
      const ativo = StorageService.obterTurnoAtivo();
      if (!ativo) return;

      const horasDecorridas = Math.max(0.5, Number(((Date.now() - ativo.inicioMs) / 3600000).toFixed(1)));

      if (ativo.kmInicial > 0) document.getElementById('kmInicial').value = ativo.kmInicial;
      document.getElementById('horasTrabalhadas').value = horasDecorridas;
      if (ativo.combustivel > 0) document.getElementById('combustivel').value = ativo.combustivel.toFixed(2);
      if (ativo.alimentacao > 0) document.getElementById('alimentacao').value = ativo.alimentacao.toFixed(2);
      if (ativo.outrosGastos > 0) document.getElementById('outrosGastos').value = ativo.outrosGastos.toFixed(2);

      this.navegarAba('fechar');
      document.getElementById('kmFinal').focus();
      this.notificar('Dados do turno preenchidos! Informe o KM Final e Faturamento.');
    },

    cancelarTurnoVivo() {
      if (confirm('Cancelar o turno em andamento sem salvar?')) {
        StorageService.salvarTurnoAtivo(null);
        this.renderizarTurnoVivo();
      }
    },

    /* --- Helpers do Formulário de Fechamento --- */
    puxarUltimoKmFinal() {
      const ultimo = StorageService.obterTurnos().find(t => t.kmFinal && t.kmFinal > 0);
      if (ultimo) {
        document.getElementById('kmInicial').value = ultimo.kmFinal;
        this.aoMudarOdometro();
        this.notificar(`KM Inicial preenchido: ${ultimo.kmFinal}`);
      } else {
        this.notificar('Nenhum KM Final anterior salvo.');
      }
    },

    aoMudarOdometro() {
      const kmIni = this.lerNumero('kmInicial');
      const kmFim = this.lerNumero('kmFinal');
      if (kmFim > kmIni) {
        document.getElementById('kmTotalInput').value = (kmFim - kmIni).toFixed(1).replace(/\.0$/, '');
        this.calcularCombustivelPorConsumo();
      }
    },

    somarApps() {
      const soma = this.lerNumero('ganhoUber') + this.lerNumero('ganho99') + this.lerNumero('ganhoOutros');
      if (soma > 0) {
        document.getElementById('faturamento').value = soma.toFixed(2);
      }
    },

    calcularCombustivelPorConsumo() {
      const kmIni = this.lerNumero('kmInicial');
      const kmFim = this.lerNumero('kmFinal');
      const kmTotal = kmFim > kmIni ? (kmFim - kmIni) : this.lerNumero('kmTotalInput');
      const kml = this.lerNumero('consumoKmL');
      const preco = this.lerNumero('precoLitro');

      if (kml > 0) StorageService.salvarValor(KEYS.CONSUMO_KML, kml);
      if (preco > 0) StorageService.salvarValor(KEYS.PRECO_LITRO, preco);

      if (kmTotal > 0 && kml > 0 && preco > 0) {
        const custoComb = (kmTotal / kml) * preco;
        document.getElementById('combustivel').value = custoComb.toFixed(2);
      }
    },

    formatarDataBR(iso) {
      if (!iso || !iso.includes('-')) return new Date().toLocaleDateString('pt-BR');
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    },

    salvarFechamento() {
      const entrada = {
        dataISO: document.getElementById('dataTurno').value,
        horas: this.lerNumero('horasTrabalhadas'),
        kmIni: this.lerNumero('kmInicial'),
        kmFim: this.lerNumero('kmFinal'),
        kmDireto: this.lerNumero('kmTotalInput'),
        corridas: Math.round(this.lerNumero('corridas')),
        faturamento: this.lerNumero('faturamento'),
        combustivel: this.lerNumero('combustivel'),
        alimentacao: this.lerNumero('alimentacao'),
        diariaCarro: this.lerNumero('diariaCarro'),
        outrosGastos: this.lerNumero('outrosGastos'),
        custoKm: this.lerNumero('custoKm')
      };

      const calc = FinanceEngine.calcularTurno(entrada);

      if (entrada.faturamento <= 0 && calc.kmTotal <= 0) {
        this.notificar('Informe o Faturamento ou KM Rodado!');
        return;
      }

      StorageService.salvarValor(KEYS.CUSTO_KM, entrada.custoKm);

      const dataBR = this.formatarDataBR(entrada.dataISO);
      const avaliacao = FinanceEngine.avaliarRentabilidade(calc);

      // Mantém compatibilidade total com `turnos_app`
      const registro = {
        id: Date.now(),
        data: dataBR,
        dataISO: entrada.dataISO,
        kmInicial: entrada.kmIni,
        kmFinal: entrada.kmFim,
        kmTotal: calc.kmTotal,
        horas: entrada.horas,
        corridas: entrada.corridas,
        faturamento: Number(entrada.faturamento.toFixed(2)),
        custosTotais: calc.custosTotais,
        combustivel: Number(entrada.combustivel.toFixed(2)),
        alimentacao: Number(entrada.alimentacao.toFixed(2)),
        diariaCarro: Number(entrada.diariaCarro.toFixed(2)),
        outrosGastos: Number(entrada.outrosGastos.toFixed(2)),
        provisaoManut: calc.provisaoManut,
        lucroLiquido: calc.lucroLiquido,
        brutoKm: calc.brutoKm,
        liquidoKm: calc.liquidoKm,
        liquidoHora: calc.liquidoHora,
        ticketMedio: calc.ticketMedio
      };

      const turnos = StorageService.obterTurnos();
      turnos.unshift(registro);
      StorageService.salvarTurnos(turnos);

      // Se havia um turno ao vivo aberto, encerra-o automaticamente
      StorageService.salvarTurnoAtivo(null);

      this.exibirRecibo(registro, calc, avaliacao);
      this.renderizarTurnoVivo();
      this.atualizarPainel();
      this.renderizarHistorico();
      this.notificar('Fechamento salvo com sucesso!');
    },

    exibirRecibo(reg, calc, avaliacao) {
      const box = document.getElementById('boxResultado');
      box.style.display = 'block';
      const corLucro = parseFloat(reg.lucroLiquido) >= 0 ? 'var(--uber-green)' : 'var(--uber-red)';

      box.innerHTML = `
        <div class="card-header-row">
          <strong>Recibo • ${reg.data}</strong>
          <span class="status-badge ${avaliacao.classe}">${avaliacao.rotulo}</span>
        </div>
        <div class="receipt-row"><span>KM Total Rodado</span><span>${reg.kmTotal} km</span></div>
        <div class="receipt-row"><span>Faturamento Bruto</span><span>R$ ${reg.faturamento.toFixed(2)}</span></div>
        <div class="receipt-row"><span>Despesas do Dia</span><span style="color:var(--uber-red)">- R$ ${calc.gastosDiretos.toFixed(2)}</span></div>
        <div class="receipt-row"><span>Reserva Manutenção (KM)</span><span style="color:var(--uber-yellow)">- R$ ${calc.provisaoManut.toFixed(2)}</span></div>
        <div class="receipt-row"><span>Ganho por KM (Bruto / Líq.)</span><span>R$ ${reg.brutoKm} / <b>R$ ${reg.liquidoKm}</b></span></div>
        ${reg.horas > 0 ? `<div class="receipt-row"><span>Ganho Líquido por Hora</span><span>R$ ${reg.liquidoHora}/h</span></div>` : ''}
        <div class="receipt-row"><span>Ticket Médio (${reg.corridas} corridas)</span><span>R$ ${reg.ticketMedio}</span></div>
        <div class="receipt-total">
          <span>Lucro Líquido (${calc.margemLiquida}%)</span>
          <span style="color:${corLucro}">R$ ${reg.lucroLiquido}</span>
        </div>
        <button type="button" class="btn-uber-ghost" style="margin-top:14px;" onclick="UIController.copiarWhatsApp()">
          📲 Copiar Resumo para WhatsApp
        </button>
      `;

      this.ultimoTextoWhatsApp =
        `🖤 *FECHAMENTO MEU TURNO (${reg.data})*\n` +
        `💰 *Bruto:* R$ ${reg.faturamento.toFixed(2)}\n` +
        `⛽ *Custos Totais:* R$ ${reg.custosTotais.toFixed(2)}\n` +
        `✅ *LUCRO LÍQUIDO:* R$ ${reg.lucroLiquido} (${calc.margemLiquida}%)\n` +
        `🛣️ *KM:* ${reg.kmTotal} km (Líq: R$ ${reg.liquidoKm}/km)\n` +
        (reg.horas > 0 ? `⏱️ *Horas:* ${reg.horas}h (Líq: R$ ${reg.liquidoHora}/h)\n` : '') +
        `🏁 *Corridas:* ${reg.corridas} (Ticket: R$ ${reg.ticketMedio})`;
    },

    copiarWhatsApp() {
      if (!this.ultimoTextoWhatsApp) return;
      navigator.clipboard.writeText(this.ultimoTextoWhatsApp).then(() => {
        this.notificar('Resumo copiado para colar no WhatsApp!');
      });
    },

    /* --- Painel de Ganhos e Meta Diária --- */
    mudarPeriodo(periodo, btn) {
      this.periodoAtual = periodo;
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      this.atualizarPainel();
    },

    parseData(item) {
      if (item.dataISO) {
        const [y, m, d] = item.dataISO.split('-').map(Number);
        return new Date(y, m - 1, d);
      }
      if (item.data && item.data.includes('/')) {
        const [d, m, y] = item.data.split('/').map(Number);
        return new Date(y, m - 1, d);
      }
      return new Date();
    },

    atualizarPainel() {
      const turnos = StorageService.obterTurnos();
      const agora = new Date();
      const hojeStr = agora.toLocaleDateString('pt-BR');

      // Lucro de hoje para a pílula superior e barra de meta
      const lucroHoje = turnos
        .filter(t => t.data === hojeStr)
        .reduce((acc, t) => acc + (parseFloat(t.lucroLiquido) || 0), 0);

      document.getElementById('pillLucroHoje').textContent = `R$ ${lucroHoje.toFixed(2)}`;

      const filtrados = turnos.filter(t => {
        if (this.periodoAtual === 'hoje') return t.data === hojeStr;
        const dt = this.parseData(t);
        if (this.periodoAtual === '7dias') {
          const diff = (agora - dt) / 86400000;
          return diff >= -1 && diff <= 7;
        }
        if (this.periodoAtual === 'mes') {
          return dt.getMonth() === agora.getMonth() && dt.getFullYear() === agora.getFullYear();
        }
        return true;
      });

      const titulos = {
        hoje: 'LUCRO LÍQUIDO LIVRE (HOJE)',
        '7dias': 'LUCRO LÍQUIDO LIVRE (ÚLTIMOS 7 DIAS)',
        mes: 'LUCRO LÍQUIDO LIVRE (MÊS ATUAL)',
        tudo: 'LUCRO LÍQUIDO LIVRE (ACUMULADO GERAL)'
      };
      document.getElementById('lblPeriodoTitulo').textContent = titulos[this.periodoAtual];

      let somaLucro = 0, somaBruto = 0, somaCustos = 0, somaKm = 0, somaHoras = 0;

      filtrados.forEach(item => {
        const luc = parseFloat(item.lucroLiquido) || 0;
        const fat = parseFloat(item.faturamento) || 0;
        const cus = item.custosTotais !== undefined ? parseFloat(item.custosTotais) : Math.max(0, fat - luc);
        somaLucro += luc;
        somaBruto += fat;
        somaCustos += cus;
        somaKm += parseFloat(item.kmTotal) || 0;
        somaHoras += parseFloat(item.horas) || 0;
      });

      const mediaKm = somaKm > 0 ? (somaLucro / somaKm) : 0;
      const mediaHora = somaHoras > 0 ? (somaLucro / somaHoras) : 0;

      const elLucro = document.getElementById('kpiLucroLiquido');
      elLucro.textContent = `R$ ${somaLucro.toFixed(2)}`;
      elLucro.style.color = somaLucro >= 0 ? 'var(--uber-white)' : 'var(--uber-red)';

      document.getElementById('kpiBruto').textContent = `R$ ${somaBruto.toFixed(2)}`;
      document.getElementById('kpiCustos').textContent = `R$ ${somaCustos.toFixed(2)}`;
      document.getElementById('kpiTurnosCount').textContent = `${filtrados.length} turno${filtrados.length === 1 ? '' : 's'}`;

      document.getElementById('kpiMediaKm').textContent = `R$ ${mediaKm.toFixed(2)}`;
      document.getElementById('kpiMediaHora').textContent = somaHoras > 0 ? `R$ ${mediaHora.toFixed(2)}/h` : '—';
      document.getElementById('kpiKmRodado').textContent = `${somaKm.toFixed(0)} km`;

      // Meta Diária
      const meta = StorageService.obterNumero(KEYS.META_DIARIA, DEFAULTS.META_DIARIA);
      const pct = meta > 0 ? Math.min(100, Math.max(0, (lucroHoje / meta) * 100)) : 0;
      document.getElementById('barraMetaFill').style.width = `${pct}%`;

      const falta = Math.max(0, meta - lucroHoje);
      document.getElementById('txtMetaInfo').innerHTML = lucroHoje >= meta
        ? `🏆 Meta Batida Hoje! <strong>R$ ${lucroHoje.toFixed(2)} / R$ ${meta.toFixed(2)}</strong>`
        : `🎯 Meta Hoje: <strong>R$ ${meta.toFixed(2)}</strong> (Falta R$ ${falta.toFixed(2)})`;
    },

    editarMetaDiaria() {
      const atual = StorageService.obterNumero(KEYS.META_DIARIA, DEFAULTS.META_DIARIA);
      const entrada = prompt('Qual sua meta de LUCRO LÍQUIDO diário (R$)?', String(atual));
      if (!entrada) return;
      const val = parseFloat(entrada.replace(',', '.'));
      if (!isNaN(val) && val > 0) {
        StorageService.salvarValor(KEYS.META_DIARIA, val.toFixed(2));
        this.atualizarPainel();
        this.notificar('Meta diária atualizada!');
      }
    },

    /* --- Histórico e Exportação --- */
    renderizarHistorico() {
      const turnos = StorageService.obterTurnos();
      const container = document.getElementById('listaHistorico');

      if (turnos.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:28px 12px; color:var(--uber-muted); font-size:0.86rem;">
            Nenhum turno salvo ainda. Inicie ou feche seu dia para ver suas estatísticas!
          </div>
        `;
        return;
      }

      container.innerHTML = turnos.map((item, idx) => {
        const fat = item.faturamento !== undefined ? `Bruto: R$ ${Number(item.faturamento).toFixed(2)}` : '';
        const cus = item.custosTotais !== undefined ? `Custos: R$ ${Number(item.custosTotais).toFixed(2)}` : '';
        const hrs = item.horas ? `${item.horas}h (R$ ${item.liquidoHora}/h)` : '';

        return `
          <div class="activity-item">
            <div class="act-header">
              <span class="act-title">${item.data} • ${item.kmTotal} km</span>
              <div style="display:flex; align-items:center; gap:10px;">
                <span class="act-net">R$ ${item.lucroLiquido}</span>
                <button class="chip-btn" style="padding:3px 8px;" onclick="UIController.excluirTurno(${idx})" title="Excluir">✕</button>
              </div>
            </div>
            <div class="act-meta">
              ${fat ? `<span>${fat}</span>` : ''}
              ${cus ? `<span>• ${cus}</span>` : ''}
              <span>• R$ ${item.liquidoKm}/km</span>
              ${hrs ? `<span>• ${hrs}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    },

    excluirTurno(index) {
      if (!confirm('Remover este registro do histórico?')) return;
      const turnos = StorageService.obterTurnos();
      turnos.splice(index, 1);
      StorageService.salvarTurnos(turnos);
      this.renderizarHistorico();
      this.atualizarPainel();
      this.notificar('Turno removido.');
    },

    limparTodoHistorico() {
      if (confirm('Apagar TODOS os turnos salvos neste aparelho?')) {
        localStorage.removeItem(KEYS.TURNOS);
        this.renderizarHistorico();
        this.atualizarPainel();
        document.getElementById('boxResultado').style.display = 'none';
        this.notificar('Histórico apagado.');
      }
    },

    exportarCSV() {
      const turnos = StorageService.obterTurnos();
      if (turnos.length === 0) {
        this.notificar('Nenhum turno para exportar.');
        return;
      }

      const cols = [
        'Data', 'KM_Total', 'Horas', 'Corridas', 'Faturamento_Bruto',
        'Combustivel', 'Alimentacao', 'Diaria_Carro', 'Outros_Gastos',
        'Reserva_Manutencao', 'Custo_Total', 'Lucro_Liquido', 'Liquido_KM', 'Ticket_Medio'
      ];

      const linhas = turnos.map(t => [
        t.data || '', t.kmTotal || 0, t.horas || 0, t.corridas || 0, t.faturamento || 0,
        t.combustivel || 0, t.alimentacao || 0, t.diariaCarro || 0, t.outrosGastos || 0,
        t.provisaoManut || 0, t.custosTotais || 0, t.lucroLiquido || 0, t.liquidoKm || 0, t.ticketMedio || 0
      ].join(';'));

      const blob = new Blob(['\uFEFF' + cols.join(';') + '\n' + linhas.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `meu-turno-uber-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      this.notificar('Planilha CSV baixada!');
    },

    async instalarPWA() {
      if (!this.deferredPrompt) return;
      this.deferredPrompt.prompt();
      await this.deferredPrompt.userChoice;
      this.deferredPrompt = null;
      document.getElementById('btnInstall').style.display = 'none';
    }
  };

  window.addEventListener('DOMContentLoaded', () => UIController.iniciar());

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    UIController.deferredPrompt = e;
    document.getElementById('btnInstall').style.display = 'inline-block';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
